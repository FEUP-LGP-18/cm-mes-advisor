name: Vercel Production Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Build and deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Check Vercel secrets
        id: config
        run: |
          ready=true
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              ready=false
            fi
          done

          echo "ready=$ready" >> "$GITHUB_OUTPUT"

          if [ "$ready" != "true" ]; then
            echo "Vercel production deploy skipped because one or more required GitHub Actions secrets are missing." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable Corepack
        if: steps.config.outputs.ready == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        if: steps.config.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel production settings
        if: steps.config.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        if: steps.config.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifacts
        if: steps.config.outputs.ready == 'true'
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production URL: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
